name: test
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --all-extras --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy artifactor
      - run: uv run pytest -m "not slow"
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: nf-core/setup-nextflow@b4ec1bc7c16a94435159de94a05253542fddf6ef
        with:
          version: latest-stable
      - run: uv sync --all-extras --locked
      - run: uv run artifactor simulate --scenario separable --output demo/ci
      - run: docker build -t artifactor:0.1.0 .
      - run: nextflow run main.nf -profile test,docker --config_path "$PWD/demo/ci/config.yaml" -resume
