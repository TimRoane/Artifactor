[project]
name = "artifactor-omics"
version = "0.5.0"
description = "Assay-aware technical artifact analysis for multi-omics cohorts"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Artifactor contributors"}]
dependencies = [
  "jinja2>=3.1,<4", "numpy>=1.26,<3", "openpyxl>=3.1,<4", "pandas>=2.2,<3",
  "plotly>=5.20,<7", "polars>=1.0,<2", "pyarrow>=16,<22",
  "pydantic>=2.7,<3", "pyyaml>=6,<7", "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2", "statsmodels>=0.14,<1", "typer>=0.12,<1",
  "psutil>=5.9,<8"
]

[project.optional-dependencies]
ui = ["streamlit>=1.36,<2"]
dev = ["hypothesis>=6.100", "mypy>=1.10", "pre-commit>=3.7", "pytest>=8", "ruff>=0.5", "pandas-stubs>=2.2"]

[project.scripts]
artifactor = "artifactor.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["artifactor"]

[tool.hatch.build.targets.wheel.force-include]
"app" = "app"
"datasets/registry.yaml" = "artifactor/datasets/registry.yaml"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.hypothesis", "/.mypy_cache", "/.pytest_cache", "/.ruff_cache", "/.uv-cache",
  "/.venv", "/benchmark", "/data", "/demo", "/dist", "/results", "/work",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: scientific regression tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
