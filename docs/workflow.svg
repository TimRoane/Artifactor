<svg xmlns="http://www.w3.org/2000/svg" width="960" height="180" viewBox="0 0 960 180" role="img" aria-labelledby="title desc">
  <title id="title">Artifactor workflow</title><desc id="desc">Inputs flow through design audit, diagnostics, correction comparison, and evidence report.</desc>
  <style>text{font:15px system-ui;fill:#17212b}.box{fill:#eef7f3;stroke:#2e7d6e;stroke-width:2}.gate{fill:#fff4dc;stroke:#a86100;stroke-width:2}.arrow{stroke:#52606d;stroke-width:2;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#52606d"/></marker></defs>
  <rect class="box" x="20" y="55" rx="10" width="150" height="70"/><text x="95" y="85" text-anchor="middle">Manifest +</text><text x="95" y="107" text-anchor="middle">omics matrices</text>
  <line class="arrow" x1="170" y1="90" x2="215" y2="90"/><rect class="gate" x="220" y="55" rx="10" width="150" height="70"/><text x="295" y="85" text-anchor="middle">Identifiability</text><text x="295" y="107" text-anchor="middle">gate</text>
  <line class="arrow" x1="370" y1="90" x2="415" y2="90"/><rect class="box" x="420" y="55" rx="10" width="150" height="70"/><text x="495" y="85" text-anchor="middle">Latent + variance</text><text x="495" y="107" text-anchor="middle">diagnostics</text>
  <line class="arrow" x1="570" y1="90" x2="615" y2="90"/><rect class="box" x="620" y="55" rx="10" width="150" height="70"/><text x="695" y="85" text-anchor="middle">Correction</text><text x="695" y="107" text-anchor="middle">Pareto audit</text>
  <line class="arrow" x1="770" y1="90" x2="815" y2="90"/><rect class="box" x="820" y="55" rx="10" width="120" height="70"/><text x="880" y="85" text-anchor="middle">Evidence +</text><text x="880" y="107" text-anchor="middle">follow-up</text>
</svg>
